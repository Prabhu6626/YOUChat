name: youchat
description: "YOUChat - Secure End-to-End Encrypted Messaging"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Encryption - Signal Protocol
  libsignal_protocol_dart: ^0.7.1

  # Secure storage for encryption keys
  flutter_secure_storage: ^9.2.4

  # WebSocket client
  web_socket_channel: ^3.0.2

  # HTTP client
  http: ^1.3.0

  # State management
  provider: ^6.1.2

  # Image picker for profile pictures
  image_picker: ^1.1.2

  # Image caching
  cached_network_image: ^3.4.1

  # UUID for message IDs
  uuid: ^4.5.1

  # Google Fonts
  google_fonts: ^6.2.1

  # Screenshot / screen recording prevention
  no_screenshot: ^0.3.0
  file_picker: ^8.1.1
  encrypt: ^5.0.3
  dio: ^5.9.2
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  flutter_sound: ^9.16.3
  flutter_local_notifications: ^19.5.0
  connectivity_plus: ^6.1.1
  firebase_core: ^3.9.0
  firebase_messaging: ^15.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
